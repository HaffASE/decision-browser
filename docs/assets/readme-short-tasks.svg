<text x="905" y="301" fill="#F3F7FA" font-size="23" font-weight="400" text-anchor="end">7.45 s</text>
<text x="1080" y="301" fill="#F3F7FA" font-size="22" font-weight="400" text-anchor="end">$0.16625</text>
</g>
