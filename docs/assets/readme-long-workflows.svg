<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="838" viewBox="0 0 1120 838" role="img" aria-labelledby="title description">
<title id="title">Long workflows · historical browser-agent comparison</title>
<desc id="description">Archived 3 November 2026 measurements. All seven configurations are visible without animation. Bars show confirmed attempts out of 15; time is the median across all attempts, including failures. Costs estimate scored calls. These are not results for the current release candidate.</desc>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1120" height="838" rx="20" fill="#0E1D27" />
<text x="40" y="49" fill="#7CE4C1" font-size="17" font-weight="700" text-anchor="start">HISTORICAL BENCHMARK</text>
<text x="1080" y="49" fill="#B8C9D3" font-size="17" font-weight="700" text-anchor="end">03 NOV 2026</text>
<text x="40" y="103" fill="#F3F7FA" font-size="43" font-weight="700" text-anchor="start">Long workflows</text>
<text x="40" y="140" fill="#B8C9D3" font-size="22" font-weight="400" text-anchor="start">5 multi-step tasks × 3 repetitions per configuration</text>
<text x="40" y="180" fill="#B8C9D3" font-size="18" font-weight="400" text-anchor="start">Read completion first. A fast early stop is still an unsuccessful attempt.</text>
<rect x="40" y="203" width="1040" height="1" rx="0" fill="#314854" />
<text x="40" y="236" fill="#B8C9D3" font-size="16" font-weight="700" text-anchor="start">AGENT / MODEL</text>
<text x="395" y="236" fill="#B8C9D3" font-size="16" font-weight="700" text-anchor="start">CONFIRMED OUTCOMES</text>
<text x="905" y="230" fill="#B8C9D3" font-size="16" font-weight="700" text-anchor="end">MEDIAN TIME</text>
<text x="905" y="251" fill="#B8C9D3" font-size="15" font-weight="400" text-anchor="end">per attempt</text>
<text x="1080" y="230" fill="#B8C9D3" font-size="16" font-weight="700" text-anchor="end">EST. COST</text>
<text x="1080" y="251" fill="#B8C9D3" font-size="15" font-weight="400" text-anchor="end">for 15 attempts</text>
<g data-engine="terra" data-route="responses" data-confirmed="9" data-attempts="15" data-median-ms="20662" data-cost-usd="0.22552325">
<rect x="32" y="264" width="1056" height="58" rx="7" fill="#152B37" />
