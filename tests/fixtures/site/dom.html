<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture</title>
<style>
body{font:16px sans-serif;margin:1rem}
#overlay[hidden]{display:none}
#overlay:not([hidden]){position:fixed;inset:0;z-index:999;background:#fff}
#spacer{height:180vh}
</style>
</head>
<body>
<main id="supported">
<p id="status">ready</p>
<label>Count <output id="counter">0</output></label>
<button type="button" id="increment">Increment</button>
<label for="name">Name</label>
<input id="name" type="text" value="seed">
<label>Autosaves <output id="autosaves">0</output></label>
<label for="color">Color</label>
<select id="color">
<option>red</option>
<option>blue</option>
<option>green</option>
</select>
<form id="search" action="/search" method="get">
<label for="query">Query</label>
<input id="query" name="query" type="text">
<button id="submit" type="submit" formaction="/override" formmethod="post">Submit</button>
</form>
<form id="post" action="/post" method="post">
<label for="post-body">Body</label>
<input id="post-body" name="body" type="text">
<button type="submit">Send</button>
</form>
<a id="neutral" href="/next">Next</a>
<a id="mutable" href="/next">Mutable</a>
<label for="mutable-input">Mutable input</label>
<input id="mutable-input" type="text" value="edit">
</main>
<div id="unsupported-area">
<canvas id="canvas" width="20" height="20"></canvas>
<iframe id="frame" title="Static" srcdoc="<p>static</p>"></iframe>
<label for="upload">Upload</label>
<input id="upload" type="file">
<a id="download" href="/file.txt" download>Download</a>
<a id="newtab" href="/next" target="_blank" rel="noopener">New tab</a>
<div id="shadow-host"></div>
</div>
<div id="overlay" hidden></div>
<div id="spacer"></div>
<footer>End of fixture for scroll.</footer>
<script>
window.fixtureState={counter:0,autosaves:0,submits:0,changes:0,route:"",method:""};
document.getElementById("increment").addEventListener("click",function(){
window.fixtureState.counter+=1;
document.getElementById("counter").textContent=String(window.fixtureState.counter);
});
document.getElementById("name").addEventListener("input",function(){
window.fixtureState.autosaves+=1;
document.getElementById("autosaves").textContent=String(window.fixtureState.autosaves);
});
document.getElementById("color").addEventListener("change",function(){
window.fixtureState.changes+=1;
});
document.getElementById("search").addEventListener("submit",function(e){
e.preventDefault();
var s=e.submitter;
window.fixtureState.submits+=1;
window.fixtureState.route=(s&&s.getAttribute("formaction"))||e.target.getAttribute("action");
window.fixtureState.method=((s&&s.getAttribute("formmethod"))||e.target.getAttribute("method")||"get").toLowerCase();
});
document.getElementById("post").addEventListener("submit",function(e){e.preventDefault();});
document.getElementById("shadow-host").attachShadow({mode:"open"}).innerHTML="<button type=\"button\">In shadow</button>";
</script>
</body>
</html>
