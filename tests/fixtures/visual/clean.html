<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Clean control</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #fff;
      color: #444;
    }
    main {
      max-width: 36rem;
      margin: 0 auto;
      padding: 1rem 1.25rem;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    label { color: #555; }
    input, button {
      font: inherit;
      color: #333;
      background: #f4f4f4;
      border: 1px solid #ccc;
      padding: 0.5rem 0.75rem;
      max-width: 100%;
    }
  </style>
</head>
<body>
  <main>
    <form action="#">
      <label for="query">Search</label>
      <input id="query" name="query" type="text" value="atlas">
      <button id="submit" type="submit">Search</button>
    </form>
  </main>
</body>
</html>
