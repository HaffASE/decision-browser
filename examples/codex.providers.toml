# Project-local opt-in: copy ONE block into the selected project's config.
# Replace absolute paths, then set enabled = true for that block.
# All examples are disabled here; no key value is stored.

[mcp_servers.decision_browser_typesafe]
enabled = false
command = "/absolute/path/to/decision-browser"
args = ["serve", "--admission", "standard_form"]
cwd = "/absolute/path/to/project"
env_vars = ["TYPESAFE_API_KEY"]
[mcp_servers.decision_browser_typesafe.env]
DECISION_BROWSER_PROVIDER = "typesafe"
DECISION_BROWSER_MODEL = "jev-latest"

[mcp_servers.decision_browser_openrouter]
enabled = false
command = "/absolute/path/to/decision-browser"
args = ["serve", "--admission", "standard_form"]
cwd = "/absolute/path/to/project"
env_vars = ["OPENROUTER_API_KEY"]
[mcp_servers.decision_browser_openrouter.env]
DECISION_BROWSER_PROVIDER = "openrouter"
DECISION_BROWSER_MODEL = "typesafe/jev-1.13"

[mcp_servers.decision_browser_local]
enabled = false
command = "/absolute/path/to/decision-browser"
args = ["serve", "--admission", "standard_form"]
cwd = "/absolute/path/to/project"
[mcp_servers.decision_browser_local.env]
DECISION_BROWSER_PROVIDER = "local"
DECISION_BROWSER_ENDPOINT = "http://127.0.0.1:8000/v1/systemone"
DECISION_BROWSER_MODEL = "nimble-latest"
DECISION_BROWSER_MAX_CHOICES = "26"
# Optional independent local chat helper; replace with an installed text model.
# DECISION_BROWSER_TEXT_ENDPOINT = "http://127.0.0.1:11434/v1/chat/completions"
# DECISION_BROWSER_TEXT_MODEL = "your-installed-text-model"
# A remote helper also needs its own DECISION_BROWSER_TEXT_API_KEY in env_vars.

[mcp_servers.decision_browser_opencode]
enabled = false
command = "/absolute/path/to/decision-browser"
args = ["serve", "--admission", "standard_form"]
cwd = "/absolute/path/to/project"
env_vars = ["OPENCODE_API_KEY"]
[mcp_servers.decision_browser_opencode.env]
DECISION_BROWSER_PROVIDER = "opencode"
# OpenCode Console System One API.
DECISION_BROWSER_MODEL = "jev-1.13"

[mcp_servers.decision_browser_gemini]
enabled = false
command = "/absolute/path/to/decision-browser"
args = ["serve", "--admission", "standard_form"]
cwd = "/absolute/path/to/project"
env_vars = ["OPENCODE_API_KEY"]
[mcp_servers.decision_browser_gemini.env]
DECISION_BROWSER_PROVIDER = "gemini"
DECISION_BROWSER_MODEL = "gemini-decision-1"
# Uses the OpenCode Console System One API and a Console key.

[mcp_servers.decision_browser_ollama]
enabled = false
command = "/absolute/path/to/decision-browser"
args = ["serve", "--admission", "standard_form"]
cwd = "/absolute/path/to/project"
[mcp_servers.decision_browser_ollama.env]
DECISION_BROWSER_PROVIDER = "local"
DECISION_BROWSER_ENDPOINT = "http://127.0.0.1:11434/v1/systemone"
DECISION_BROWSER_MODEL = "nimble:latest"
DECISION_BROWSER_MAX_CHOICES = "26"
