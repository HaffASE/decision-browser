# Project-local registration on macOS. The native route reads its named
# Keychain credential when needed, without saving a key in this file.
[mcp_servers.decision_browser]
command = "/absolute/path/to/decision-browser"
args = ["serve", "--admission", "standard_form"]
cwd = "/absolute/path/to/project"
[mcp_servers.decision_browser.env]
DECISION_BROWSER_PROVIDER = "openai"
