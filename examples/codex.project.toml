# Project-local opt-in only.
# No global write. No key value is stored; the variable is named, not set.
[mcp_servers.decision_browser]
command = "/absolute/path/to/decision-browser/.venv/bin/python"
args = ["-m", "decision_browser.cli", "serve"]
cwd = "/absolute/path/to/decision-browser"
env_vars = ["OPENAI_API_KEY"]
