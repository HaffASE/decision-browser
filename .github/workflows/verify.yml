name: Verify

"on":
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Python ${{ matrix.python }}
    if: github.ref_type != 'tag'
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize runner-local paths
        id: paths
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?}" "${GITHUB_ENV:?}"
          {
            printf 'UV_PROJECT_ENVIRONMENT=%s\n' "$RUNNER_TEMP/decision-browser-venv"
            printf 'UV_CACHE_DIR=%s\n' "$RUNNER_TEMP/decision-browser-uv-cache"
            printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$RUNNER_TEMP/decision-browser-browsers"
            printf 'CI_EVIDENCE_ROOT=%s\n' "$RUNNER_TEMP/decision-browser-evidence"
          } >> "$GITHUB_ENV"

      - name: Check out source
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'

      - name: Check legacy version consistency
        run: python -I scripts/check_release.py

      - name: Set up uv
        id: uv
        uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867 # v7.1.6
        with:
          version: '0.13.7'
          enable-cache: false

      - name: Record setup and install locked dependencies
        run: |
          set -euo pipefail
          mkdir -p "$CI_EVIDENCE_ROOT"
          {
            python -I -c 'import platform, sys; print(sys.version); print(sys.executable); print(platform.platform())'
            cat /etc/os-release
            uv --version
            current_python="$(python -I -c 'import sys; print(sys.executable)')"
            uv --no-config --no-python-downloads lock --check
            uv --no-config --no-python-downloads sync --frozen --group dev --no-install-project --python "$current_python"
          } 2>&1 | tee "$CI_EVIDENCE_ROOT/setup.log"

      - name: Install official pinned Chromium and host dependencies
        run: |
          set -euo pipefail
          "$UV_PROJECT_ENVIRONMENT/bin/python" -I -m playwright install --with-deps chromium \
            2>&1 | tee "$CI_EVIDENCE_ROOT/browser-install.log"

      # A failed install must stay failed, but the verifier can still record
      # BLOCKED prerequisites and NOT_RUN coverage. Do not use continue-on-error.
      - name: Run full verification and preserve prerequisite failures
        if: ${{ !cancelled() && steps.paths.outcome == 'success' && steps.checkout.outcome == 'success' && steps.python.outcome == 'success' && steps.uv.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p "$CI_EVIDENCE_ROOT"
          # Hosted Python 3.12 reached 433 passing tests at the old 900s
          # suite deadline; 558 integration tests plus unit tests must finish.
          # This outer budget does not change any browser/action test timeout.
          python -I scripts/verify.py --profile full --timeout 1800 --output-dir "$CI_EVIDENCE_ROOT/verification" \
            2>&1 | tee "$CI_EVIDENCE_ROOT/verifier.log"

      - name: Build and check standalone installer
        if: success()
        run: |
          set -euo pipefail
          dist="$CI_EVIDENCE_ROOT/verification/dist"
          python -I scripts/build_installer.py --wheel "$dist"/*.whl --output "$dist/decision-browser.pyz"
          python -I "$dist/decision-browser.pyz" --help
          (cd "$dist" && sha256sum decision-browser.pyz > installer.sha256)

      - name: Build and check npm launcher (no publication)
        if: success()
        run: |
          set -euo pipefail
          dist="$CI_EVIDENCE_ROOT/verification/dist"
          python -I scripts/build_npm.py --wheel "$dist"/*.whl --output "$CI_EVIDENCE_ROOT/npm-candidate"
          node "$CI_EVIDENCE_ROOT/npm-candidate/bin/decision-browser.cjs" --help
          (cd "$CI_EVIDENCE_ROOT/npm-candidate" && npm pack --offline --ignore-scripts --pack-destination "$dist")
          candidate=("$dist"/*.tgz)
          npm exec --offline --yes --package="${candidate[0]}" -- decision-browser --version
          (cd "$dist" && sha256sum ./*.tgz > npm.sha256)

      - name: Upload bounded verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: verification-py${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/decision-browser-evidence/setup.log
            ${{ runner.temp }}/decision-browser-evidence/browser-install.log
            ${{ runner.temp }}/decision-browser-evidence/verifier.log
            ${{ runner.temp }}/decision-browser-evidence/verification/result.json
            ${{ runner.temp }}/decision-browser-evidence/verification/*.log
            ${{ runner.temp }}/decision-browser-evidence/verification/pytest-*.xml
            ${{ runner.temp }}/decision-browser-evidence/verification/dist/*.pyz
            ${{ runner.temp }}/decision-browser-evidence/verification/dist/installer.sha256
            ${{ runner.temp }}/decision-browser-evidence/verification/dist/*.tgz
            ${{ runner.temp }}/decision-browser-evidence/verification/dist/npm.sha256
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  rust:
    name: Verify Rust
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require a Python-free tree for release tags
        if: github.ref_type == 'tag'
        run: sh scripts/check-python-free.sh

      - name: Install Rust and check the native crate
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          cargo +1.100.0 fmt --manifest-path prototypes/rust-cdp-counter/Cargo.toml --check
          cargo +1.100.0 clippy --manifest-path prototypes/rust-cdp-counter/Cargo.toml --locked --all-targets -- -D warnings
          cargo +1.100.0 test --manifest-path prototypes/rust-cdp-counter/Cargo.toml --locked --all-targets
          cargo +1.100.0 run --manifest-path prototypes/rust-cdp-counter/Cargo.toml --locked --bin check-native-release
      - name: Build the checked native candidate
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RUSTUP_TOOLCHAIN: 1.100.0
        run: sh scripts/build-native-release.sh --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/native-candidate"
      - name: Verify the unpacked native archive
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/native-candidate"
          sha256sum -c SHA256SUMS
          scratch=$(mktemp -d)
          archive=(decision-browser-*.tar.gz)
          tar -xzf "${archive[0]}" -C "$scratch"
          cd "$scratch/${archive[0]%.tar.gz}"
          sha256sum -c SHA256SUMS
          ./bin/decision-browser --version
      - name: Upload the native candidate
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: native-candidate-${{ github.ref_name }}-linux-x64
          path: ${{ runner.temp }}/native-candidate/
          if-no-files-found: error
          retention-days: 14

  release-ready:
    name: Release candidate gate
    needs: [rust]
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require the Python-free native candidate
        run: echo "Native candidate built and verified. Publication requires separate review."
