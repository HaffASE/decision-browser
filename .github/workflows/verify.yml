name: Verify

"on":
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native verification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require a Python-free source and build tree
        run: sh scripts/check-python-free.sh

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy

      - name: Select the installed Chrome executable
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == macOS ]]; then
            chrome='/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          else
            chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          fi
          test -x "$chrome"
          "$chrome" --version
          printf 'DECISION_BROWSER_CHROME=%s\n' "$chrome" >> "$GITHUB_ENV"

      - name: Format, lint and run every native test with Chrome
        env:
          RUSTUP_TOOLCHAIN: 1.100.0
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-evidence"
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --include-ignored --test-threads=1 2>&1 | tee "$RUNNER_TEMP/native-evidence/tests.log"
          cargo run --locked --bin check-native-release

      - name: Set up Node.js for the optional npm package checks
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'

      - name: Test the optional native launcher
        run: node --test npm/test/*.test.cjs

      - name: Build and inspect the native candidate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RUSTUP_TOOLCHAIN: 1.100.0
        run: |
          set -euo pipefail
          args=(--npm --output "$RUNNER_TEMP/native-candidate")
          if [[ "$REF_TYPE" == tag ]]; then args+=(--tag "$RELEASE_TAG"); fi
          sh scripts/build-native-release.sh "${args[@]}"
          sh scripts/smoke-native-package.sh "$RUNNER_TEMP/native-candidate" 2>&1 | tee "$RUNNER_TEMP/native-evidence/archive-smoke.log"
          package=("$RUNNER_TEMP/native-candidate/"*.tgz)
          npm --cache "$RUNNER_TEMP/offline-npm-cache" exec --offline --yes --package="${package[0]}" -- decision-browser --version

      - name: Upload verification evidence and native candidates
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: native-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-evidence/
            ${{ runner.temp }}/native-candidate/*.tar.gz
            ${{ runner.temp }}/native-candidate/*.tgz
            ${{ runner.temp }}/native-candidate/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14

  npm-package:
    name: Assemble the public npm candidate
    needs: [native]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: native-*-${{ github.run_id }}-*
          path: ${{ runner.temp }}/platforms
      - name: Build one npm archive with both verified executables
        shell: bash
        run: |
          set -euo pipefail
          candidates=()
          for host in macos-15 ubuntu-22.04; do
            best_attempt=0
            candidate=
            for artifact in "$RUNNER_TEMP/platforms/native-$host-$GITHUB_RUN_ID-"*; do
              path="$artifact/native-candidate"
              [[ -f "$path/SHA256SUMS" ]] || continue
              attempt="${artifact##*-}"
              if (( attempt > best_attempt )); then
                best_attempt=$attempt
                candidate=$path
              fi
            done
            test -n "$candidate"
            candidates+=("$candidate")
          done
          sh scripts/build-npm-release.sh "${candidates[@]}" "$RUNNER_TEMP/npm-release"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: npm-release-candidate
          path: ${{ runner.temp }}/npm-release/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  npm-smoke:
    name: Public npm smoke (${{ matrix.os }})
    needs: [npm-package]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: npm-release-candidate
          path: ${{ runner.temp }}/npm-release
      - name: Install the exact tarball offline and run the Chrome probe
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/npm-release"
          shasum -a 256 -c SHA256SUMS
          packages=("$PWD/"haffa-decision-browser-*.tgz)
          test "${#packages[@]}" = 1
          test -f "${packages[0]}"
          archive="${packages[0]}"
          version=$(basename "$archive" .tgz)
          version="${version#haffa-decision-browser-}"
          if [[ "$RUNNER_OS" == macOS ]]; then
            export DECISION_BROWSER_CHROME='/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          else
            export DECISION_BROWSER_CHROME
            DECISION_BROWSER_CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          fi
          runner=(npm --cache "$RUNNER_TEMP/npm-release-cache" exec --offline --yes --package="$archive" -- decision-browser)
          test "$("${runner[@]}" --version)" = "decision-browser $version"
          "${runner[@]}" probe-browser

  release-ready:
    name: Release candidate gate
    needs: [native, npm-smoke]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require the native and npm package matrices
        run: echo "Native and npm candidates passed on Linux and macOS."
